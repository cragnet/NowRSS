name: nowrss
description: "AI-powered RSS reader for Linux with Feedbin sync"
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  sqflite_common_ffi: ^2.3.4
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  flutter_html: ^3.0.0-beta.2
  file_picker: ^8.1.2
  intl: ^0.20.1
  provider: ^6.1.2
  logger: ^2.5.0
  path: ^1.9.0
  html: ^0.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
